<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub铝金属3D轮播 - 已修复加载问题</title>
    <style>
        :root {
            --metal-primary: #e8e8e8;
            --metal-secondary: #c0c0c0;
            --metal-accent: #a0a0a0;
            --metal-dark: #2a2a2a;
            --metal-light: #f5f5f5;
            --aluminum-color: #cccccc;
            --oxidized-color: #a8a8a8;
            --success-color: #4CAF50;
            --error-color: #f44336;
            --warning-color: #ff9800;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            color: var(--metal-light);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--aluminum-color), var(--metal-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error-color);
        }
        
        .status-dot.connected {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 1200px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .viewer-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .carousel-container {
            position: relative;
            width: 100%;
            height: 650px;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1a1a;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        
        .model-info {
            padding: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .model-title {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--metal-light);
        }
        
        .model-description {
            color: var(--metal-secondary);
            font-size: 1.1rem;
        }
        
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metal-btn {
            background: linear-gradient(135deg, #333, #555);
            color: var(--metal-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .metal-btn:hover {
            background: linear-gradient(135deg, #444, #666);
            transform: scale(1.1);
            color: var(--metal-light);
        }
        
        .play-pause-btn {
            width: 80px;
            height: 80px;
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--aluminum-color), var(--oxidized-color));
            color: #1a1a1a;
        }
        
        .control-sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .config-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--metal-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .github-config {
            margin-bottom: 25px;
        }
        
        .config-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--metal-light);
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        .config-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--aluminum-color), var(--oxidized-color));
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .config-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .material-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .material-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--metal-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .material-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .material-btn.active {
            background: linear-gradient(135deg, var(--aluminum-color), var(--oxidized-color));
            color: #1a1a1a;
        }
        
        .slider-group {
            margin-bottom: 20px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--metal-secondary);
        }
        
        .slider-value {
            color: var(--metal-primary);
            font-weight: 600;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--aluminum-color), var(--oxidized-color));
            cursor: pointer;
        }
        
        .model-list-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .model-list-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .model-list {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        
        .model-list-item {
            padding: 18px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .model-list-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .model-list-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--aluminum-color);
        }
        
        .model-icon {
            font-size: 1.8rem;
            color: var(--aluminum-color);
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--aluminum-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--aluminum-color), var(--oxidized-color));
            color: #1a1a1a;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            max-width: 400px;
            font-weight: 600;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast.error {
            background: linear-gradient(135deg, #f44336, #ff6b6b);
            color: white;
        }
        
        .toast.success {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
        }
        
        .debug-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug-title {
            color: var(--warning-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .debug-log {
            color: var(--metal-secondary);
            line-height: 1.5;
        }
        
        .debug-success {
            color: var(--success-color);
        }
        
        .debug-error {
            color: var(--error-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub铝金属3D轮播 - 修复版</h1>
            <p>解决GitHub GLB模型加载问题的完整方案</p>
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">等待配置GitHub仓库</span>
            </div>
        </header>
        
        <div class="content-grid">
            <div class="viewer-section">
                <div class="carousel-container">
                    <div class="loading-overlay" id="loading-overlay">

                <div class="model-info">

                    </div>

                <div class="carousel-controls">

                        ◀

            <div class="control-sidebar">

                    <div class="github-config">

                        <button class="config-btn" id="load-github-btn">
                            从GitHub加载模型

                </div>
                
                <div class="config-panel">

                    <div class="material-controls">
                        <button class="material-btn active" id="aluminum-btn" disabled>

                <div class="model-list-container">

                    <div class="model-list" id="model-list">

    <div class="toast" id="toast">GitHub铝金属3D轮播已加载</div>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script>
        // 铝金属材质配置
        const ALUMINUM_MATERIALS = {
            aluminum: {
                name: "纯铝",
                metallic: 0.95,
                roughness: 0.15,
                baseColor: "#E8E8E8"
            },
            oxidized: {
                name: "氧化铝",
                metallic: 0.85,
                roughness: 0.45,
                baseColor: "#C8C8C8"
            },
            anodized: {
                name: "阳极氧化铝",
                metallic: 0.75,
                roughness: 0.35,
                baseColor: "#3A6EA5"
            },
            brushed: {
                name: "拉丝铝",
                metallic: 0.90,
                roughness: 0.25,
                baseColor: "#D0D0D0"
            }
        };

        // CORS代理服务器列表（备用方案）
        const CORS_PROXIES = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url=',
            'https://thingproxy.freeboard.io/fetch/'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const modelViewer = document.getElementById('model-viewer');
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const debugLog = document.getElementById('debug-log');
            
            // 配置输入元素
            const githubUserInput = document.getElementById('github-user');
            const githubRepoInput = document.getElementById('github-repo');
            const githubBranchInput = document.getElementById('github-branch');
            const modelsFolderInput = document.getElementById('models-folder');
            const loadGithubBtn = document.getElementById('load-github-btn');
            
            // 控制元素
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const togglePlayBtn = document.getElementById('toggle-play');
            const playIcon = document.getElementById('play-icon');
            const modelTitle = document.getElementById('model-title');
            const modelDescription = document.getElementById('model-description');
            const modelCount = document.getElementById('model-count');
            const modelList = document.getElementById('model-list');
            const toast = document.getElementById('toast');
            
            // 材质控制元素
            const materialButtons = document.querySelectorAll('.material-btn');
            const metallicSlider = document.getElementById('metallic-slider');
            const metallicValue = document.getElementById('metallic-value');
            const roughnessSlider = document.getElementById('roughness-slider');
            const roughnessValue = document.getElementById('roughness-value');
            const durationSlider = document.getElementById('duration-slider');
            const durationValue = document.getElementById('duration-value');
            
            // 程序状态
            let models = [];
            let currentIndex = 0;
            let isPlaying = false;
            let playInterval = null;
            let currentMaterial = 'aluminum';
            let carouselDuration = 10;
            let currentProxyIndex = 0;
            
            // 添加调试信息
            function addDebugLog(message, type = 'info') {
                const time = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.innerHTML = `<span style="color: #666;">[${time}]</span> ${message}`;
                logEntry.className = `debug-${type}`;
                debugLog.appendChild(logEntry);
                debugLog.scrollTop = debugLog.scrollHeight;
                
                // 限制日志数量
                if (debugLog.children.length > 20) {
                    debugLog.removeChild(debugLog.firstChild);
                }
            }
            
            // 显示提示消息
            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = `toast ${type} show`;
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }
            
            // 更新状态指示器
            function updateStatus(status, message) {
                statusDot.className = 'status-dot';
                if (status === 'connected') {
                    statusDot.classList.add('connected');
                    statusText.textContent = `✓ ${message}`;
                } else if (status === 'error') {
                    statusText.textContent = `✗ ${message}`;
                } else {
                    statusText.textContent = message;
                }
            }
            
            // 启用/禁用控制
            function enableControls(enabled) {
                const controls = [prevBtn, nextBtn, togglePlayBtn, ...materialButtons, 
                                metallicSlider, roughnessSlider, durationSlider];
                
                controls.forEach(control => {
                    control.disabled = !enabled;
                });
                
                if (enabled) {
                    addDebugLog('✓ 控制功能已启用', 'success');
                }
            }
            
            // 尝试通过不同方法获取GitHub文件
            async function fetchGitHubFile(url) {
                let lastError;
                
                // 方法1：直接访问
                try {
                    addDebugLog(`尝试直接访问: ${url}`);
                    const response = await fetch(url);
                    if (response.ok) {
                        addDebugLog('✓ 直接访问成功', 'success');
                        return await response.text();
                    }
                    throw new Error(`HTTP ${response.status}`);
                } catch (error) {
                    lastError = error;
                    addDebugLog(`✗ 直接访问失败: ${error.message}`, 'error');
                }
                
                // 方法2：使用GitHub API
                try {
                    const apiUrl = url.replace('https://raw.githubusercontent.com/', 'https://api.github.com/repos/');
                    const apiUrl2 = apiUrl.replace('/main/', '/contents/');
                    
                    addDebugLog(`尝试GitHub API: ${apiUrl2}`);
                    const response = await fetch(apiUrl2, {
                        headers: {
                            'Accept': 'application/vnd.github.v3.raw'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.text();
                        addDebugLog('✓ GitHub API成功', 'success');
                        return data;
                    }
                    throw new Error(`API HTTP ${response.status}`);
                } catch (error) {
                    lastError = error;
                    addDebugLog(`✗ GitHub API失败: ${error.message}`, 'error');
                }
                
                // 方法3：使用CORS代理
                for (let i = 0; i < CORS_PROXIES.length; i++) {
                    try {
                        const proxyUrl = CORS_PROXIES[i] + encodeURIComponent(url);
                        addDebugLog(`尝试CORS代理 ${i + 1}: ${proxyUrl.substring(0, 80)}...`);
                        
                        const response = await fetch(proxyUrl);
                        if (response.ok) {
                            const data = await response.text();
                            addDebugLog(`✓ CORS代理 ${i + 1} 成功`, 'success');
                            currentProxyIndex = i;
                            return data;
                        }
                        throw new Error(`Proxy HTTP ${response.status}`);
                    } catch (error) {
                        lastError = error;
                        addDebugLog(`✗ CORS代理 ${i + 1} 失败: ${error.message}`, 'error');
                    }
                }
                
                throw lastError;
            }
            
            // 获取GitHub目录列表
            async function getGitHubDirectory(user, repo, branch, path) {
                try {
                    const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=${branch}`;
                    addDebugLog(`获取目录列表: ${apiUrl}`);
                    
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`GitHub API返回 ${response.status}`);
                    }
                    
                    const data = await response.json();
                    return data.filter(item => 
                        item.type === 'file' && 
                        item.name.toLowerCase().endsWith('.glb')
                    );
                } catch (error) {
                    addDebugLog(`✗ 获取目录列表失败: ${error.message}`, 'error');
                    return [];
                }
            }
            
            // 从GitHub加载模型
            async function loadModelsFromGitHub() {
                const user = githubUserInput.value.trim();
                const repo = githubRepoInput.value.trim();
                const branch = githubBranchInput.value.trim() || 'main';
                const folder = modelsFolderInput.value.trim() || 'models';
                
                if (!user || !repo) {
                    showToast('请输入GitHub用户名和仓库名', 'error');
                    return;
                }
                
                loadingText.innerHTML = `
                    <div style="margin-bottom: 10px;">正在从GitHub加载...</div>
                    <div style="font-size: 0.9rem; opacity: 0.8;">
                        仓库: ${user}/${repo}<br>
                        分支: ${branch}<br>
                        路径: ${folder}/
                    </div>
                `;
                loadingOverlay.style.display = 'flex';
                updateStatus('loading', '正在连接GitHub...');
                
                addDebugLog(`开始加载: ${user}/${repo}/${folder}/`);
                
                try {
                    // 尝试读取models.json配置文件
                    const modelsJsonUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${folder}/models.json`;
                    addDebugLog(`尝试加载配置文件: ${modelsJsonUrl}`);
                    
                    let modelsData;
                    try {
                        const configText = await fetchGitHubFile(modelsJsonUrl);
                        modelsData = JSON.parse(configText);
                        addDebugLog('✓ 配置文件解析成功', 'success');
                    } catch (configError) {
                        addDebugLog('✗ 配置文件不存在，尝试扫描目录', 'warning');
                        
                        // 扫描目录获取GLB文件
                        const files = await getGitHubDirectory(user, repo, branch, folder);
                        
                        if (files.length === 0) {
                            throw new Error('未找到GLB文件');
                        }
                        
                        modelsData = {
                            models: files.map(file => ({
                                name: file.name.replace('.glb', '').replace('.GLB', ''),
                                description: `从GitHub加载的模型: ${file.name}`,
                                url: `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${folder}/${file.name}`,
                                thumbnail: '📦',
                                size: formatFileSize(file.size)
                            }))
                        };
                    }
                    
                    models = modelsData.models || [];
                    
                    if (models.length === 0) {
                        throw new Error('没有找到可用的模型');
                    }
                    
                    // 验证模型URL
                    for (let i = 0; i < Math.min(models.length, 3); i++) {
                        const model = models[i];
                        addDebugLog(`验证模型: ${model.name}`);
                        
                        try {
                            const testResponse = await fetch(model.url, { method: 'HEAD' });
                            if (!testResponse.ok) {
                                addDebugLog(`✗ 模型 ${model.name} 可能无法访问: HTTP ${testResponse.status}`, 'warning');
                            } else {
                                addDebugLog(`✓ 模型 ${model.name} 可访问`, 'success');
                            }
                        } catch (error) {
                            addDebugLog(`✗ 模型 ${model.name} 验证失败: ${error.message}`, 'warning');
                        }
                    }
                    
                    updateStatus('connected', `已连接: ${models.length} 个模型`);
                    showToast(`成功加载 ${models.length} 个模型`, 'success');
                    
                    // 更新UI
                    modelCount.textContent = `${models.length} 个模型`;
                    updateModelList();
                    updateModelViewer();
                    enableControls(true);
                    
                    if (models.length > 1) {
                        startAutoPlay();
                    }
                    
                    loadingOverlay.style.display = 'none';
                    
                } catch (error) {
                    console.error('GitHub加载失败:', error);
                    addDebugLog(`✗ 加载失败: ${error.message}`, 'error');
                    
                    updateStatus('error', `加载失败: ${error.message}`);
                    showToast(`加载失败: ${error.message}`, 'error');
                    
                    // 使用示例模型作为后备
                    useExampleModels();
                }
            }
            
            // 使用示例模型
            function useExampleModels() {
                addDebugLog('使用示例模型作为后备', 'warning');
                
                models = [
                    {
                        name: "示例铝制零件",
                        description: "演示铝金属材质效果",
                        url: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
                        thumbnail: "🔧",
                        size: "2.3 MB"
                    },
                    {
                        name: "铝结构模型",
                        description: "展示铝金属光泽",
                        url: "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb",
                        thumbnail: "🏗️",
                        size: "1.8 MB"
                    }
                ];
                
                updateStatus('connected', `示例模式: ${models.length} 个模型`);
                showToast('使用示例模型进行演示', 'info');
                
                modelCount.textContent = `${models.length} 个模型`;
                updateModelList();
                updateModelViewer();
                enableControls(true);
                
                if (models.length > 1) {
                    startAutoPlay();
                }
                
                loadingOverlay.style.display = 'none';
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (!bytes) return '未知大小';
                const units = ['B', 'KB', 'MB', 'GB'];
                let size = bytes;
                let unitIndex = 0;
                
                while (size >= 1024 && unitIndex < units.length - 1) {
                    size /= 1024;
                    unitIndex++;
                }
                
                return `${size.toFixed(1)} ${units[unitIndex]}`;
            }
            
            // 更新模型列表
            function updateModelList() {
                modelList.innerHTML = '';
                
                models.forEach((model, index) => {
                    const item = document.createElement('div');
                    item.className = `model-list-item ${index === currentIndex ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="model-icon">${model.thumbnail || '📦'}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 600; margin-bottom: 5px;">${model.name}</div>
                            <div style="font-size: 0.9rem; color: var(--metal-secondary);">
                                ${model.description || '铝金属3D模型'}
                            </div>
                            <div style="font-size: 0.8rem; color: var(--metal-accent); margin-top: 5px;">
                                ${model.size || ''}
                            </div>
                        </div>
                    `;
                    
                    item.addEventListener('click', () => {
                        currentIndex = index;
                        updateModelViewer();
                        updateModelList();
                    });
                    
                    modelList.appendChild(item);
                });
            }
            
            // 更新模型查看器
            function updateModelViewer() {
                if (models.length === 0) return;
                
                const currentModel = models[currentIndex];
                
                loadingText.textContent = `正在加载: ${currentModel.name}`;
                loadingOverlay.style.display = 'flex';
                
                // 使用代理URL（如果需要）
                let modelUrl = currentModel.url;
                
                // 如果是GitHub raw URL且之前使用了代理，则使用代理
                if (modelUrl.includes('raw.githubusercontent.com') && currentProxyIndex >= 0) {
                    modelUrl = CORS_PROXIES[currentProxyIndex] + encodeURIComponent(modelUrl);
                    addDebugLog(`使用代理加载模型: ${modelUrl.substring(0, 100)}...`);
                }
                
                // 设置模型源
                modelViewer.src = modelUrl;
                
                // 更新标题和描述
                modelTitle.textContent = currentModel.name;
                modelDescription.textContent = currentModel.description || '铝金属3D模型';
                
                // 模型加载完成后隐藏加载状态并应用材质
                const onLoad = () => {
                    loadingOverlay.style.display = 'none';
                    applyAluminumMaterial();
                    addDebugLog(`✓ 模型加载成功: ${currentModel.name}`, 'success');
                    
                    modelViewer.removeEventListener('load', onLoad);
                    modelViewer.removeEventListener('error', onError);
                };
                
                const onError = (error) => {
                    addDebugLog(`✗ 模型加载失败: ${currentModel.name}`, 'error');
                    addDebugLog(`错误详情: ${error.detail || '未知错误'}`, 'error');
                    
                    // 尝试使用备用URL
                    if (!modelUrl.includes('modelviewer.dev')) {
                        showToast('模型加载失败，尝试备用方案', 'error');
                        setTimeout(() => {
                            modelViewer.src = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
                        }, 1000);
                    }
                    
                    modelViewer.removeEventListener('load', onLoad);
                    modelViewer.removeEventListener('error', onError);
                };
                
                modelViewer.addEventListener('load', onLoad);
                modelViewer.addEventListener('error', onError);
                
                // 更新列表选中状态
                updateModelList();
            }
            
            // 应用铝金属材质
            function applyAluminumMaterial() {
                if (!modelViewer.model) return;
                
                const material = ALUMINUM_MATERIALS[currentMaterial];
                
                try {
                    if (modelViewer.model && modelViewer.model.materials) {
                        const materials = modelViewer.model.materials;
                        
                        for (let i = 0; i < materials.length; i++) {
                            const mat = materials[i];
                            
                            mat.pbrMetallicRoughness.setBaseColorFactor(material.baseColor);
                            mat.pbrMetallicRoughness.setMetallicFactor(material.metallic);
                            mat.pbrMetallicRoughness.setRoughnessFactor(material.roughness);
                            
                            // 设置自发光模拟金属光泽
                            mat.setEmissiveFactor([0.02, 0.02, 0.02]);
                            mat.setEmissiveStrength(1.0);
                        }
                        
                        // 更新显示值
                        metallicValue.textContent = material.metallic.toFixed(2);
                        roughnessValue.textContent = material.roughness.toFixed(2);
                        
                        addDebugLog(`✓ 应用材质: ${material.name}`, 'success');
                    }
                } catch (error) {
                    console.warn('材质应用失败:', error);
                    addDebugLog(`✗ 材质应用失败: ${error.message}`, 'error');
                }
            }
            
            // 下一个模型
            function nextModel() {
                if (models.length === 0) return;
                
                currentIndex = (currentIndex + 1) % models.length;
                updateModelViewer();
            }
            
            // 上一个模型
            function prevModel() {
                if (models.length === 0) return;
                
                currentIndex = (currentIndex - 1 + models.length) % models.length;
                updateModelViewer();
            }
            
            // 开始自动轮播
            function startAutoPlay() {
                if (playInterval) clearInterval(playInterval);
                
                if (isPlaying && models.length > 1) {
                    playInterval = setInterval(() => {
                        nextModel();
                    }, carouselDuration * 1000);
                    
                    playIcon.textContent = '⏸';
                    isPlaying = true;
                }
            }
            
            // 停止自动轮播
            function stopAutoPlay() {
                if (playInterval) {
                    clearInterval(playInterval);
                    playInterval = null;
                }
                
                playIcon.textContent = '▶';
                isPlaying = false;
            }
            
            // 切换播放状态
            function togglePlay() {
                if (models.length < 2) {
                    showToast('需要至少2个模型才能轮播');
                    return;
                }
                
                isPlaying = !isPlaying;
                
                if (isPlaying) {
                    startAutoPlay();
                    showToast('轮播已开始');
                } else {
                    stopAutoPlay();
                    showToast('轮播已暂停');
                }
            }
            
            // 更新材质显示
            function updateMaterialDisplay() {
                const material = ALUMINUM_MATERIALS[currentMaterial];
                
                // 更新按钮状态
                materialButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.id === `${currentMaterial}-btn`);
                });
                
                // 更新滑块值
                metallicSlider.value = material.metallic;
                roughnessSlider.value = material.roughness;
                
                metallicValue.textContent = material.metallic.toFixed(2);
                roughnessValue.textContent = material.roughness.toFixed(2);
                
                // 应用材质
                applyAluminumMaterial();
                
                showToast(`已切换至${material.name}材质`);
            }
            
            // 更新轮播时长
            function updateDurationDisplay() {
                durationValue.textContent = `${carouselDuration}秒`;
                
                if (isPlaying) {
                    startAutoPlay();
                }
            }
            
            // 事件监听
            loadGithubBtn.addEventListener('click', loadModelsFromGitHub);
            
            prevBtn.addEventListener('click', prevModel);
            nextBtn.addEventListener('click', nextModel);
            togglePlayBtn.addEventListener('click', togglePlay);
            
            // 材质按钮事件
            materialButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    if (btn.disabled) return;
                    
                    currentMaterial = btn.id.replace('-btn', '');
                    updateMaterialDisplay();
                });
            });
            
            // 滑块事件
            metallicSlider.addEventListener('input', function() {
                if (this.disabled) return;
                
                metallicValue.textContent = parseFloat(this.value).toFixed(2);
                ALUMINUM_MATERIALS[currentMaterial].metallic = parseFloat(this.value);
                applyAluminumMaterial();
            });
            
            roughnessSlider.addEventListener('input', function() {
                if (this.disabled) return;
                
                roughnessValue.textContent = parseFloat(this.value).toFixed(2);
                ALUMINUM_MATERIALS[currentMaterial].roughness = parseFloat(this.value);
                applyAluminumMaterial();
            });
            
            durationSlider.addEventListener('input', function() {
                if (this.disabled) return;
                
                carouselDuration = parseInt(this.value);
                updateDurationDisplay();
            });
            
            // 键盘控制
            document.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowLeft' && !prevBtn.disabled) {
                    event.preventDefault();
                    prevModel();
                } else if (event.key === 'ArrowRight' && !nextBtn.disabled) {
                    event.preventDefault();
                    nextModel();
                } else if (event.key === ' ' && !togglePlayBtn.disabled) {
                    event.preventDefault();
                    togglePlay();
                }
            });
            
            // 初始化
            addDebugLog('✓ 页面初始化完成', 'success');
            showToast('请配置您的GitHub仓库信息');
            
            // 自动尝试加载示例配置（如果URL中有参数）
            const urlParams = new URLSearchParams(window.location.search);
            const autoUser = urlParams.get('user');
            const autoRepo = urlParams.get('repo');
            
            if (autoUser && autoRepo) {
                githubUserInput.value = autoUser;
                githubRepoInput.value = autoRepo;
                
                // 延迟加载，让用户看到发生了什么
                setTimeout(() => {
                    addDebugLog(`自动加载配置: ${autoUser}/${autoRepo}`);
                    loadModelsFromGitHub();
                }, 1000);
            }
        });
    </script>
</body>
</html>
